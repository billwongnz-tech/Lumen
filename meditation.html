<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen – Sacred Circuits</title>
<style>
  body {
    margin: 0; background: #0a0a0a; color: #fff;
    font-family: system-ui, sans-serif; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; text-align: center;
  }
  #bg { position: fixed; inset: 0; background: #111 center/cover no-repeat; z-index: 0; }
  #card {
    position: relative; z-index: 2; background: rgba(0,0,0,0.65);
    border-radius: 16px; padding: 16px; max-width: 420px; width: 100%;
  }
  #cardImg {
    width: 100%; max-height: 60vh; object-fit: contain; border-radius: 12px;
    background: #000;
  }
  #number { font-size: 0.9rem; color: #aaa; margin: 8px 0; }
  #timer { font-size: 2rem; margin: 6px 0; }
  button {
    background: #2a5; color: #fff; border: none; padding: 10px 16px;
    border-radius: 8px; margin: 4px; cursor: pointer;
  }
  select { padding: 8px; border-radius: 8px; margin: 6px; }
  a.home {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    background: rgba(0,0,0,0.55); color: #fff; text-decoration: none;
    padding: 8px 14px; border-radius: 20px;
  }
</style>
</head>
<body>
<div id="bg"></div>
<a href="index.html" class="home">Home</a>

<div id="card">
  <img id="cardImg" src="" alt="Circuit card">
  <div id="number">Card 1 of 6</div>
  <div id="timer">1:00</div>
  <div>
    <button id="startBtn">Start</button>
    <button id="pauseBtn">Pause</button>
    <button id="nextBtn">Next</button>
    <br>
    <select id="jump">
      <option value="">Jump to card…</option>
    </select>
  </div>
</div>

<script>
const cards = [
  "circuit1.jpg",
  "circuit2.jpg",
  "circuit3.jpg",
  "circuit4.jpg",
  "circuit5.jpg",
  "circuit6.jpg"
];

let current = 0;
let timeLeft = 60;
let timerId = null;
let running = false;

const imgEl = document.getElementById('cardImg');
const numberEl = document.getElementById('number');
const timerEl = document.getElementById('timer');
const jumpSelect = document.getElementById('jump');
const startBtn = document.getElementById('startBtn');

function showCard(index) {
  current = index;
  imgEl.src = cards[current];
  numberEl.textContent = `Card ${current + 1} of ${cards.length}`;
  resetTimer();
}

function resetTimer() {
  clearInterval(timerId);
  running = false;
  timeLeft = 60;
  timerEl.textContent = "1:00";
  startBtn.textContent = "Start";
}

function updateTimerDisplay() {
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  timerEl.textContent = m + ":" + (s < 10 ? "0" : "") + s;
}

function startTimer() {
  if (running) return;
  running = true;
  startBtn.textContent = "Running";
  timerId = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      nextCard(true); // auto-advance and keep running
    }
  }, 1000);
}

function pauseTimer() {
  clearInterval(timerId);
  running = false;
  startBtn.textContent = "Start";
}

function nextCard(auto = false) {
  if (current < cards.length - 1) {
    showCard(current + 1);
    if (auto) startTimer(); // restart timer automatically
  } else {
    clearInterval(timerId);
    running = false;
    timerEl.textContent = "Done";
    numberEl.textContent = "Session complete";
    startBtn.textContent = "Start";
  }
}

// Jump menu
cards.forEach((_, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = "Card " + (i + 1);
  jumpSelect.appendChild(opt);
});

startBtn.onclick = startTimer;
document.getElementById('pauseBtn').onclick = pauseTimer;
document.getElementById('nextBtn').onclick = () => nextCard(false);
jumpSelect.onchange = () => {
  if (jumpSelect.value !== "") showCard(parseInt(jumpSelect.value));
};

showCard(0);
</script>
</body>
</html>
